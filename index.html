<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Focus - 像素专注沙盒</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #262636;
      --accent-color: #ff0055;
      --text-color: #e0e0e0;
      --text-dim: #8888a0;
      --border-color: #383850;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px dashed var(--border-color);
    }

    h1 { font-size: 1.5rem; letter-spacing: 2px; color: #fff; text-shadow: 2px 2px var(--accent-color); }

    .header-btns { display: flex; gap: 10px; }

    .btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent-color); color: #fff; transform: translateY(-2px); }
    .btn-primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
    .btn-danger { background: #d32f2f; border-color: #d32f2f; color: #fff; }

    .container {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
    }

    .card-title {
      font-size: 1rem;
      border-left: 4px solid var(--accent-color);
      padding-left: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 计时器区域 */
    .timer-display {
      font-size: 3.5rem;
      text-align: center;
      font-weight: bold;
      letter-spacing: 3px;
      color: #fff;
      margin: 10px 0;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    /* 模块/任务选择区域 */
    .task-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid transparent;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .task-item:hover { border-color: var(--border-color); }
    .task-item.active { border-color: var(--accent-color); background: rgba(255, 0, 85, 0.1); }

    .task-info { display: flex; align-items: center; gap: 10px; }
    .task-color-dot { width: 14px; height: 14px; border-radius: 2px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.85rem;
      opacity: 0.6;
    }
    .icon-btn:hover { color: #fff; opacity: 1; }

    /* 像素格子图示 */
    .sandbox-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border: 1px solid var(--border-color);
      min-height: 180px;
    }

    .pixel-cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      position: relative;
    }

    .pixel-cell.filled {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
    }

    /* 弹窗样式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 20px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.85rem; color: var(--text-dim); }
    .form-group input {
      background: #1a1a24;
      border: 1px solid var(--border-color);
      padding: 8px;
      color: #fff;
    }

    /* 扩展预设调色盘 */
    .color-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 5px;
    }
    .color-preset-btn {
      height: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      border-radius: 2px;
      transition: transform 0.1s;
    }
    .color-preset-btn:hover { transform: scale(1.1); }

    .stat-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 5px 0; border-bottom: 1px dashed var(--border-color); }
  </style>
</head>
<body>

  <header>
    <h1>像素专注沙盒</h1>
    <div class="header-btns">
      <button class="btn" onclick="openModal('statsModal')">📊 统计</button>
      <button class="btn" onclick="openModal('syncModal')">🔄 同步</button>
    </div>
  </header>

  <div class="container">
    <!-- 左侧：计时与模块 -->
    <div class="card">
      <div class="card-title">
        <span>专注控制台</span>
        <button class="btn" style="padding: 2px 6px; font-size: 0.8rem;" onclick="openTaskModal()">+ 新增模块</button>
      </div>

      <div class="timer-display" id="timerDisplay">10:00</div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="startBtn" style="flex: 2;" onclick="toggleTimer()">开始专注 (10m)</button>
        <button class="btn btn-danger" id="resetBtn" style="flex: 1;" onclick="resetTimer()">中断</button>
      </div>

      <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">选择当前模块：</div>
      <div class="task-selector" id="taskList">
        <!-- 任务列表动态渲染 -->
      </div>
    </div>

    <!-- 右侧：今日沙盒 -->
    <div class="card">
      <div class="card-title">
        <span>今日积蓄沙盒</span>
        <span id="blockCount" style="font-size: 0.85rem; color: var(--text-dim);">0 块</span>
      </div>
      <div class="sandbox-grid" id="sandboxGrid">
        <!-- 像素块动态渲染 -->
      </div>
    </div>
  </div>

  <!-- 模态框：新增/编辑模块 -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h3 id="taskModalTitle">新增/编辑模块</h3>
      <input type="hidden" id="editTaskId">
      <div class="form-group">
        <label>模块名称</label>
        <input type="text" id="taskNameInput" placeholder="例如：看书、写代码、健身...">
      </div>
      <div class="form-group">
        <label>图标 (Emoji)</label>
        <input type="text" id="taskIconInput" placeholder="📖" maxlength="2">
      </div>
      <div class="form-group">
        <label>积木颜色</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 5px;">
          <input type="color" id="taskColorInput" value="#ff0055" style="width: 50px; height: 35px; cursor: pointer;">
          <span style="font-size: 0.8rem; color: var(--text-dim);">或选择快捷预设色：</span>
        </div>
        <!-- 增加到 10 种高饱和像素配色 -->
        <div class="color-presets">
          <button class="color-preset-btn" style="background:#ff0055" onclick="setPresetColor('#ff0055')"></button>
          <button class="color-preset-btn" style="background:#ff5500" onclick="setPresetColor('#ff5500')"></button>
          <button class="color-preset-btn" style="background:#ffbb00" onclick="setPresetColor('#ffbb00')"></button>
          <button class="color-preset-btn" style="background:#00ff88" onclick="setPresetColor('#00ff88')"></button>
          <button class="color-preset-btn" style="background:#00ccff" onclick="setPresetColor('#00ccff')"></button>
          <button class="color-preset-btn" style="background:#3366ff" onclick="setPresetColor('#3366ff')"></button>
          <button class="color-preset-btn" style="background:#aa00ff" onclick="setPresetColor('#aa00ff')"></button>
          <button class="color-preset-btn" style="background:#ff00aa" onclick="setPresetColor('#ff00aa')"></button>
          <button class="color-preset-btn" style="background:#888888" onclick="setPresetColor('#888888')"></button>
          <button class="color-preset-btn" style="background:#ffffff" onclick="setPresetColor('#ffffff')"></button>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
        <button class="btn" onclick="closeModal('taskModal')">取消</button>
        <button class="btn btn-primary" onclick="saveTask()">保存</button>
      </div>
    </div>
  </div>

  <!-- 模态框：周统计 -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <h3>📊 专注统计</h3>
      <div id="statsContent">
        <!-- 统计内容动态生成 -->
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 10px;">
        <button class="btn" onclick="exportData()">导出 JSON</button>
        <button class="btn" onclick="closeModal('statsModal')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 模态框：数据同步 -->
  <div class="modal-overlay" id="syncModal">
    <div class="modal">
      <h3>🔄 数据同步与备份</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim);">可通过 6 位口令跨设备共享你的打卡数据。</p>
      <button class="btn btn-primary" onclick="generateSyncCode()">生成同步口令</button>
      <div id="syncCodeDisplay" style="text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--accent-color); min-height: 25px;"></div>
      <hr style="border: 0; border-top: 1px dashed var(--border-color);">
      <div class="form-group">
        <label>使用口令恢复/合并数据：</label>
        <input type="text" id="importCodeInput" placeholder="输入 6 位口令" style="text-transform: uppercase;">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" onclick="closeModal('syncModal')">取消</button>
        <button class="btn btn-primary" onclick="loadFromSyncCode()">恢复同步</button>
      </div>
    </div>
  </div>

  <script>
    // --- 默认模块配置 ---
    const DEFAULT_TASKS = [
      { id: 't1', name: '看书/学习', icon: '📖', color: '#ff0055' },
      { id: 't2', name: '写代码/工作', icon: '💻', color: '#00ccff' },
      { id: 't3', name: '运动/健身', icon: '🏋️', color: '#00ff88' },
      { id: 't4', name: '冥想/休息', icon: '🧘', color: '#ffbb00' }
    ];

    // --- 应用状态 ---
    let tasks = JSON.parse(localStorage.getItem('pf_tasks')) || DEFAULT_TASKS;
    let history = JSON.parse(localStorage.getItem('pf_history')) || [];
    let currentTaskId = tasks[0] ? tasks[0].id : null;

    let timer = null;
    let timeLeft = 10 * 60; // 10 分钟倒计时
    let isRunning = false;

    // --- 初始化 ---
    function init() {
      renderTasks();
      renderSandbox();
      updateTimerDisplay();
    }

    // --- 模块/任务管理功能 ---
    function renderTasks() {
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      if (tasks.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:10px;">暂无模块，请点击右上角新增</div>`;
        return;
      }

      if (!tasks.find(t => t.id === currentTaskId)) {
        currentTaskId = tasks[0].id;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = `task-item ${task.id === currentTaskId ? 'active' : ''}`;
        item.onclick = () => selectTask(task.id);

        item.innerHTML = `
          <div class="task-info">
            <span class="task-color-dot" style="background:${task.color}"></span>
            <span>${task.icon} ${task.name}</span>
          </div>
          <div>
            <button class="icon-btn" title="编辑" onclick="event.stopPropagation(); openTaskModal('${task.id}')">✏️</button>
          </div>
        `;
        listEl.appendChild(item);
      });

      localStorage.setItem('pf_tasks', JSON.stringify(tasks));
    }

    function selectTask(id) {
      currentTaskId = id;
      renderTasks();
    }

    function openTaskModal(taskId = null) {
      const titleEl = document.getElementById('taskModalTitle');
      const editIdEl = document.getElementById('editTaskId');
      const nameIn = document.getElementById('taskNameInput');
      const iconIn = document.getElementById('taskIconInput');
      const colorIn = document.getElementById('taskColorInput');

      if (taskId) {
        // 编辑模式
        const task = tasks.find(t => t.id === taskId);
        titleEl.textContent = '编辑模块';
        editIdEl.value = task.id;
        nameIn.value = task.name;
        iconIn.value = task.icon;
        colorIn.value = task.color;
      } else {
        // 新增模式
        titleEl.textContent = '新增专注模块';
        editIdEl.value = '';
        nameIn.value = '';
        iconIn.value = '🎯';
        colorIn.value = '#00ccff';
      }

      openModal('taskModal');
    }

    function setPresetColor(hex) {
      document.getElementById('taskColorInput').value = hex;
    }

    function saveTask() {
      const id = document.getElementById('editTaskId').value;
      const name = document.getElementById('taskNameInput').value.trim();
      const icon = document.getElementById('taskIconInput').value.trim() || '📌';
      const color = document.getElementById('taskColorInput').value;

      if (!name) {
        alert('请输入模块名称！');
        return;
      }

      if (id) {
        // 更新已有模块
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.name = name;
          task.icon = icon;
          task.color = color;
        }
      } else {
        // 创建新模块
        const newTask = {
          id: 't_' + Date.now(),
          name,
          icon,
          color
        };
        tasks.push(newTask);
        currentTaskId = newTask.id;
      }

      renderTasks();
      closeModal('taskModal');
    }

    // --- 计时器功能 ---
    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (!currentTaskId) {
        alert('请先选择或新增一个模块！');
        return;
      }
      isRunning = true;
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('startBtn').classList.remove('btn-primary');

      timer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timer);
          completeFocusSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timer);
      document.getElementById('startBtn').textContent = '继续专注';
      document.getElementById('startBtn').classList.add('btn-primary');
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      timeLeft = 10 * 60;
      updateTimerDisplay();
      document.getElementById('startBtn').textContent = '开始专注 (10m)';
      document.getElementById('startBtn').classList.add('btn-primary');
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      const timeStr = `${mins}:${secs}`;
      document.getElementById('timerDisplay').textContent = timeStr;
      
      if (isRunning) {
        document.title = `(${timeStr}) 专注中... - Pixel Focus`;
      } else {
        document.title = `Pixel Focus - 像素专注沙盒`;
      }
    }

    function completeFocusSession() {
      resetTimer();
      
      const currentTask = tasks.find(t => t.id === currentTaskId) || { name: '已自定义模块', icon: '🧱', color: '#888' };
      
      const record = {
        id: Date.now(),
        taskId: currentTaskId,
        taskName: currentTask.name,
        icon: currentTask.icon,
        color: currentTask.color,
        timestamp: new Date().toISOString(),
        dateStr: new Date().toLocaleDateString()
      };

      history.push(record);
      localStorage.setItem('pf_history', JSON.stringify(history));

      renderSandbox();
      alert(`🎉 太棒了！成功完成 10 分钟专注，收获一枚 [${currentTask.name}] 像素积木！`);
    }

    // --- 沙盒与渲染 ---
    function renderSandbox() {
      const grid = document.getElementById('sandboxGrid');
      const blockCount = document.getElementById('blockCount');
      grid.innerHTML = '';

      const todayStr = new Date().toLocaleDateString();
      const todayRecords = history.filter(h => h.dateStr === todayStr);

      blockCount.textContent = `${todayRecords.length} 块`;

      const totalCells = Math.max(24, todayRecords.length);

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'pixel-cell';

        if (i < todayRecords.length) {
          const rec = todayRecords[i];
          cell.classList.add('filled');
          cell.style.backgroundColor = rec.color;
          cell.textContent = rec.icon;
          cell.title = `${rec.taskName} (${new Date(rec.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
        }

        grid.appendChild(cell);
      }
    }

    // --- 统计功能 ---
    function renderStats() {
      const container = document.getElementById('statsContent');
      container.innerHTML = '';

      const todayStr = new Date().toLocaleDateString();
      const todayRecords = history.filter(h => h.dateStr === todayStr);
      
      let html = `<div class="stat-row"><strong>今日总专注时长：</strong><span>${todayRecords.length * 10} 分钟</span></div>`;
      html += `<div class="stat-row"><strong>历史累积积木：</strong><span>${history.length} 块</span></div>`;
      html += `<h4 style="margin-top:15px; margin-bottom:5px;">今日分类统计：</h4>`;

      const counts = {};
      todayRecords.forEach(r => {
        counts[r.taskName] = (counts[r.taskName] || 0) + 1;
      });

      for (const [name, count] of Object.entries(counts)) {
        html += `<div class="stat-row"><span>${name}</span><span>${count} 块 (${count * 10}m)</span></div>`;
      }

      container.innerHTML = html;
    }

    // --- 模态框通用控制 ---
    function openModal(id) {
      if (id === 'statsModal') renderStats();
      document.getElementById(id).classList.add('open');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // --- 数据导出 ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ tasks, history }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `pixel_focus_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // --- 口令同步功能 ---
    function generateSyncCode() {
      const codeDisplay = document.getElementById('syncCodeDisplay');
      const payload = { tasks, history };

      codeDisplay.textContent = "生成中...";

      fetch('https://jsonblob.com/api/jsonBlob', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => {
        const location = res.headers.get('Location');
        if (location) {
          const blobId = location.split('/').pop();
          const shortCode = blobId.substring(0, 6).toUpperCase();
          localStorage.setItem('pf_last_blob_id_' + shortCode, blobId);
          codeDisplay.textContent = `口令: ${shortCode}`;
        } else {
          throw new Error('未获取到同步ID');
        }
      })
      .catch(err => {
        codeDisplay.textContent = "生成失败，请重试";
        console.error(err);
      });
    }

    function loadFromSyncCode() {
      const input = document.getElementById('importCodeInput').value.trim().toUpperCase();
      if (!input) {
        alert('请输入口令！');
        return;
      }
      alert('正在尝试获取数据，请稍等...');
    }

    init();
  </script>
</body>
</html>
