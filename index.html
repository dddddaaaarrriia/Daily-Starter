<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Focus - 极简像素专注沙盒 (测试版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 canvas-confetti 库用于 10 分钟彩带爆破动效 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
    }

    /* 1. 像素点亮动画 */
    @keyframes pixel-glow {
      0% { opacity: 0; transform: scale(0.7); }
      70% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-pixel {
      animation: pixel-glow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-smooth {
      animation: pixel-glow 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 2. 重力下落与回弹堆叠动效 */
    @keyframes drop-bounce {
      0% {
        opacity: 0;
        transform: translateY(-20px) scale(0.6);
      }
      60% {
        opacity: 1;
        transform: translateY(3px) scale(1.1);
      }
      80% {
        transform: translateY(-1px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-drop-bounce {
      animation: drop-bounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 3. 25分钟：专属赛博霓虹脉冲光晕动效 */
    @keyframes card-pulse-glow {
      0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.7), 0 0 80px rgba(56, 189, 248, 0.4); border-color: #a855f7; }
      100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.4); }
    }
    .animate-card-pulse {
      animation: card-pulse-glow 1.2s ease-in-out;
    }

    /* 4. 长时间专注（如自由模式/长时）：全息冲击波环 */
    @keyframes holographic-shockwave {
      0% { transform: scale(0.6); opacity: 0.95; border-color: #6366f1; box-shadow: 0 0 20px #818cf8, inset 0 0 15px #6366f1; }
      50% { opacity: 0.7; border-color: #a855f7; }
      100% { transform: scale(1.65); opacity: 0; border-color: #ec4899; box-shadow: 0 0 50px rgba(236, 72, 153, 0); }
    }
    .shockwave-ring {
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      border: 2px solid #818cf8;
      pointer-events: none;
      opacity: 0;
    }
    .animate-shockwave {
      animation: holographic-shockwave 1.1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    .energy-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 0 10px currentColor;
    }

    .brick-gray {
      background-color: #334155;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.1);
    }

    /* 模式高亮 */
    .mode-tab-active {
      background-color: #1e293b;
      border-color: #38bdf8 !important;
      color: #f8fafc !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="text-slate-200 min-h-screen p-4 sm:p-8 flex flex-col justify-between antialiased selection:bg-slate-800">

  <div class="flex flex-col justify-between min-h-screen">
    <!-- 顶部 Header -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-800/80 max-w-4xl mx-auto w-full">
      <div class="flex items-center gap-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
        <h1 class="text-sm font-bold tracking-tight text-slate-100">Pixel Focus <span class="text-[10px] text-sky-400 font-normal">Test v3.1</span></h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <div id="status-text" class="text-xs font-medium text-slate-500 hidden sm:block">准备状态：等待开始</div>
        <button onclick="openSyncModal()" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 text-xs font-medium transition-all border border-slate-700/50 flex items-center gap-1">
          🔄 跨端极速同步
        </button>
        <button onclick="openStatsModal()" class="px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 text-xs font-medium transition-all border border-slate-700/50 flex items-center gap-1">
          📊 周统计与备份
        </button>
      </div>
    </header>

    <!-- 中间主要布局 -->
    <div class="flex-grow my-8 flex flex-col md:flex-row items-center justify-center gap-8 max-w-4xl mx-auto w-full">
      
      <!-- Timer 主体控制台 -->
      <main class="flex flex-col items-center justify-center gap-6 w-full max-w-md">
        
        <!-- 模式 Tab 控制栏 -->
        <div class="flex items-center justify-between bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800/80 w-full gap-2">
          <button onclick="switchMode('10m')" id="tab-10m" class="mode-tab flex-1 py-2 px-3 rounded-xl border border-transparent text-xs font-semibold text-slate-400 transition-all flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            10min 微专注
          </button>
          <button onclick="switchMode('25m')" id="tab-25m" class="mode-tab flex-1 py-2 px-3 rounded-xl border border-transparent text-xs font-semibold text-slate-400 transition-all flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            25min 番茄钟
          </button>
          <button onclick="switchMode('free')" id="tab-free" class="mode-tab flex-1 py-2 px-3 rounded-xl border border-transparent text-xs font-semibold text-slate-400 transition-all flex items-center justify-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            ⏱️ 自由模式
          </button>
        </div>

        <!-- 计时沙盒卡片 -->
        <div class="relative w-full flex justify-center items-center">
          <div id="shockwave" class="shockwave-ring"></div>

          <div id="sandbox-card" class="relative p-8 sm:p-10 bg-slate-900/80 border border-slate-800/80 rounded-3xl shadow-2xl backdrop-blur-md flex flex-col items-center w-full transition-all duration-300">
            <div class="flex justify-between items-center w-full mb-6">
              <span id="mode-badge" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">10 MINS SANDBOX</span>
              <span id="timer-countdown" class="text-base text-emerald-400 font-bold font-mono tracking-wider">10:00</span>
            </div>
            
            <!-- 像素网格 -->
            <div id="sandbox-grid" class="grid gap-3.5 my-1 min-h-[140px] items-center justify-center"></div>

            <div id="mode-reward-hint" class="text-[11px] text-slate-500 mt-5 font-medium">
              满满 10 分钟结算 1 块积木（触发彩带爆破）
            </div>
          </div>
        </div>

        <!-- 下方控制器 -->
        <div class="flex flex-col sm:flex-row items-center gap-3 bg-slate-900/80 p-2 border border-slate-800/80 rounded-2xl shadow-lg w-full">
          <div id="tag-container" class="flex flex-wrap gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800/50 flex-grow max-h-24 overflow-y-auto"></div>

          <button id="start-btn" onclick="toggleFocus()" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs tracking-wide hover:bg-emerald-400 active:scale-95 transition-all duration-200 shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0">
            开启专注
          </button>
        </div>

      </main>

      <!-- 右侧今日积蓄池 -->
      <section class="w-full sm:w-44 bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl shadow-lg backdrop-blur-sm shrink-0 h-80 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800/60">
            <span class="text-xs font-semibold text-slate-400">今日积蓄</span>
            <div class="flex items-baseline gap-1">
              <span id="today-count" class="text-sm text-sky-400 font-bold">0</span>
              <span class="text-[10px] text-slate-500">块</span>
            </div>
          </div>
          
          <div class="h-56 overflow-y-auto flex flex-col-reverse bg-slate-950/60 p-2 rounded-xl border border-slate-800/50">
            <div id="today-wall-grid" class="flex flex-wrap gap-1.5 items-end justify-start">
              <div id="empty-tip" class="text-[10px] text-slate-600 italic">尚无积木...</div>
            </div>
          </div>
        </div>
        
        <div class="text-[10px] text-slate-600 text-right font-medium">
          ▲ 向上堆叠
        </div>
      </section>

    </div>

    <!-- Footer -->
    <footer class="pt-3 border-t border-slate-800/60 text-center text-[11px] text-slate-600 font-medium max-w-4xl mx-auto w-full">
      Pixel Focus 测试版 —— 纯前端沉浸沙盒
    </footer>
  </div>

  <!-- 弹窗 1：模块管理 Modal -->
  <div id="add-task-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-md shadow-2xl flex flex-col gap-4 animate-smooth max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 id="modal-form-title" class="text-xs font-bold text-slate-200">模块分类管理</h3>
        <button onclick="closeAddTaskModal()" class="text-slate-500 hover:text-slate-300 text-xs">✕</button>
      </div>
      
      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/60 flex flex-col gap-3">
        <span id="form-mode-label" class="text-[11px] font-semibold text-slate-400 block">➕ 添加/修改模块</span>
        <input type="hidden" id="edit-task-id" value="">
        <div>
          <input id="new-task-name" type="text" placeholder="模块名称 (如: 🏃 健身)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="text-[10px] text-slate-500 block mb-1.5">选择代表像素色彩</label>
          <div id="color-picker-list" class="grid grid-cols-8 gap-2 p-1 bg-slate-900 rounded-lg border border-slate-800"></div>
        </div>

        <div class="flex gap-2">
          <button onclick="saveTaskFromModal()" class="flex-grow py-1.5 rounded-lg text-xs bg-emerald-500 text-slate-950 font-bold hover:bg-emerald-400 transition-all">保存模块</button>
          <button id="cancel-edit-btn" onclick="resetTaskForm()" class="hidden px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300 hover:bg-slate-700">取消编辑</button>
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <span class="text-[11px] font-semibold text-slate-400 block mb-1">📋 已有模块列表</span>
        <div id="custom-task-manage-list" class="flex flex-col gap-1.5 max-h-48 overflow-y-auto"></div>
      </div>

      <div class="flex justify-end pt-1">
        <button onclick="closeAddTaskModal()" class="px-3 py-1 rounded-lg text-xs text-slate-400 hover:bg-slate-800">完成关闭</button>
      </div>
    </div>
  </div>

  <!-- 弹窗 2：周统计 Modal -->
  <div id="stats-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl flex flex-col gap-4 animate-smooth">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-sm font-bold text-slate-100">近 7 天积木积累统计</h3>
          <p class="text-[10px] text-slate-500 mt-0.5">每块积木代表 10 分钟专注值</p>
        </div>
        <button onclick="closeStatsModal()" class="text-slate-500 hover:text-slate-300 text-xs">✕</button>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-6 py-2">
        <div class="relative w-36 h-36 flex items-center justify-center shrink-0">
          <canvas id="weekly-pie-canvas" width="144" height="144"></canvas>
          <div class="absolute flex flex-col items-center justify-center pointer-events-none">
            <span id="pie-total-count" class="text-base font-bold text-slate-100">0</span>
            <span class="text-[9px] text-slate-500 uppercase">Blocks</span>
          </div>
        </div>

        <div id="pie-legend" class="flex flex-col gap-1.5 w-full max-h-40 overflow-y-auto text-xs"></div>
      </div>

      <div class="pt-3 border-t border-slate-800 flex flex-col gap-2">
        <span class="text-[10px] text-slate-500">数据备份与恢复</span>
        <div class="flex flex-wrap gap-2 justify-between items-center">
          <div class="flex gap-1.5">
            <button onclick="exportDataJSON()" class="text-[10px] px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">下载 JSON</button>
            <button onclick="triggerImportJSON()" class="text-[10px] px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">导入 JSON</button>
            <input type="file" id="import-json-input" class="hidden" accept=".json" onchange="importDataJSON(event)">
          </div>
          <button onclick="copyBackupToClipboard()" class="text-[10px] px-2 py-1 bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 rounded border border-sky-500/30">📋 复制全量备份文本</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗 3：跨端极速同步 Modal（已完全重构，剔除无效二维码，换成高可靠口令快照） -->
  <div id="sync-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col gap-4 animate-smooth">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-xs font-bold text-slate-100">跨端极速同步（免扫码高可靠版）</h3>
        <button onclick="closeSyncModal()" class="text-slate-500 hover:text-slate-300 text-xs">✕</button>
      </div>

      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/60 flex flex-col gap-2.5">
        <span class="text-[11px] font-semibold text-slate-400 block">📤 步骤 1：在源设备生成快照口令</span>
        <button onclick="generateSyncSnapshot()" class="w-full py-2 rounded-lg text-xs bg-sky-500/20 text-sky-300 font-medium hover:bg-sky-500/30 border border-sky-500/30 transition-all">
          生成并复制同步快照码
        </button>
      </div>

      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/60 flex flex-col gap-2">
        <span class="text-[11px] font-semibold text-slate-400 block">📥 步骤 2：在目标设备粘贴并恢复</span>
        <textarea id="input-sync-code" rows="3" placeholder="在此粘贴另一台设备生成的同步快照码..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-[11px] text-slate-100 font-mono focus:outline-none focus:border-sky-500 resize-none"></textarea>
        <button onclick="pullDataBySnapshot()" class="w-full py-1.5 rounded-lg text-xs bg-emerald-500 text-slate-950 font-bold hover:bg-emerald-400 transition-all">
          确认一键同步（含分类与历史）
        </button>
      </div>

      <div class="text-right pt-1">
        <button onclick="closeSyncModal()" class="px-3 py-1 rounded-lg text-xs text-slate-400 hover:bg-slate-800">关闭窗口</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TITLE = "Pixel Focus - 极简像素专注沙盒";

    const PIXEL_PALETTE = [
      '#38bdf8', '#0284c7', '#fbbf24', '#d97706',
      '#f472b6', '#db2777', '#34d399', '#059669',
      '#a78bfa', '#7c3aed', '#fb923c', '#ea580c',
      '#f43f5e', '#be123c', '#2dd4bf', '#0f766e',
      '#e879f9', '#c026d3', '#a3e635', '#65a30d',
      '#facc15', '#ca8a04', '#94a3b8', '#475569'
    ];

    const DEFAULT_TASKS = [
      { id: 'coding', name: '💻 代码', color: '#38bdf8' },
      { id: 'reading', name: '📖 看书', color: '#fbbf24' },
      { id: 'creation', name: '🎨 创作', color: '#f472b6' },
      { id: 'learning', name: '📚 学习', color: '#34d399' }
    ];

    let tasks = [];
    let selectedColor = PIXEL_PALETTE[0];
    let currentTag = 'coding';
    let currentMode = '10m';
    let isFocusing = false;
    let timer = null;
    let startTime = null;

    const FREE_MODE_MAX_MINUTES = 240;

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function loadTasks() {
      const saved = localStorage.getItem('pixel_focus_tasks_v3');
      if (saved) tasks = JSON.parse(saved);
      else { tasks = [...DEFAULT_TASKS]; saveTasks(); }
    }

    function saveTasks() { localStorage.setItem('pixel_focus_tasks_v3', JSON.stringify(tasks)); }
    function getHistoryData() { return JSON.parse(localStorage.getItem('pixel_focus_history_v3') || '{}'); }
    function saveHistoryData(data) { localStorage.setItem('pixel_focus_history_v3', JSON.stringify(data)); }

    function recordTodayBricks(tagId, count) {
      if (count <= 0) return;
      const todayKey = getTodayKey();
      const history = getHistoryData();
      if (!history[todayKey]) history[todayKey] = [];
      for (let i = 0; i < count; i++) history[todayKey].push(tagId);
      saveHistoryData(history);
      renderTodayBricks();
    }

    function loadTodayData() { return getHistoryData()[getTodayKey()] || []; }

    function switchMode(mode) {
      if (isFocusing) return;
      currentMode = mode;

      document.querySelectorAll('.mode-tab').forEach(el => el.classList.remove('mode-tab-active'));
      document.getElementById(`tab-${mode}`).classList.add('mode-tab-active');

      const badge = document.getElementById('mode-badge');
      const hint = document.getElementById('mode-reward-hint');

      if (mode === '10m') {
        badge.textContent = '10 MINS SANDBOX';
        hint.textContent = '满 10 分钟结算 1 块积木';
      } else if (mode === '25m') {
        badge.textContent = '25 MINS POMODORO';
        hint.textContent = '满 25 分钟结算 3 块积木';
      } else if (mode === 'free') {
        badge.textContent = 'STOPWATCH FREE FOCUS';
        hint.textContent = '每满 10 分钟自动折算积木';
      }
      initSandbox();
    }

    function initSandbox() {
      const grid = document.getElementById('sandbox-grid');
      grid.innerHTML = '';
      let blockCount = (currentMode === 'free') ? 12 : 10;
      grid.className = (currentMode === 'free') ? 'grid grid-cols-4 gap-3.5 my-1 min-h-[140px] items-center justify-center' : 'grid grid-cols-5 gap-3.5 my-1 min-h-[140px] items-center justify-center';

      for (let i = 0; i < blockCount; i++) {
        const box = document.createElement('div');
        box.className = 'w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-slate-950/80 border border-slate-800/80 flex items-center justify-center p-1 transition-all duration-300';
        box.id = `block-${i}`;
        grid.appendChild(box);
      }

      if (currentMode === '10m') updateTimeDisplay(10 * 60);
      else if (currentMode === '25m') updateTimeDisplay(25 * 60);
      else if (currentMode === 'free') updateTimeDisplay(0);
    }

    function updateTimeDisplay(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const secs = (totalSeconds % 60).toString().padStart(2, '0');
      const timeStr = `${mins}:${secs}`;
      document.getElementById('timer-countdown').textContent = timeStr;

      if (isFocusing) {
        const currentTaskObj = tasks.find(t => t.id === currentTag);
        document.title = `(${timeStr}) ${currentTaskObj ? currentTaskObj.name : ''} | Pixel Focus`;
      } else {
        document.title = DEFAULT_TITLE;
      }
    }

    function toggleFocus() {
      const startBtn = document.getElementById('start-btn');
      const statusText = document.getElementById('status-text');

      if (!isFocusing) {
        isFocusing = true;
        startTime = Date.now();
        initSandbox();
        
        startBtn.textContent = '中断专注';
        startBtn.className = 'w-full sm:w-auto px-6 py-2.5 rounded-xl bg-rose-500 text-white font-bold text-xs tracking-wide hover:bg-rose-600 active:scale-95 transition-all duration-200 shadow-[0_0_15px_rgba(244,63,94,0.3)] shrink-0';
        statusText.textContent = '专注进行中...';
        statusText.className = 'text-xs font-medium text-amber-400 hidden sm:block';

        const totalTargetSecs = currentMode === '10m' ? 10 * 60 : (currentMode === '25m' ? 25 * 60 : 0);

        timer = setInterval(() => {
          const elapsedSecs = Math.floor((Date.now() - startTime) / 1000);
          
          if (currentMode === '10m' || currentMode === '25m') {
            const remainingSecs = Math.max(0, totalTargetSecs - elapsedSecs);
            updateTimeDisplay(remainingSecs);

            const totalBlocks = 10;
            const filledBlocks = Math.floor(elapsedSecs / (totalTargetSecs / totalBlocks));

            for (let i = 0; i < filledBlocks && i < totalBlocks; i++) {
              const block = document.getElementById(`block-${i}`);
              if (block && !block.hasChildNodes()) {
                const pixel = document.createElement('div');
                pixel.className = 'w-full h-full rounded-lg brick-gray animate-pixel';
                block.appendChild(pixel);
              }
            }

            if (elapsedSecs >= totalTargetSecs) completeSession(currentMode === '10m' ? 1 : 3);
          } else if (currentMode === 'free') {
            updateTimeDisplay(elapsedSecs);
            const gridIdx = Math.floor(elapsedSecs / 600) % 12;
            const block = document.getElementById(`block-${gridIdx}`);
            if (block && !block.hasChildNodes()) {
              const pixel = document.createElement('div');
              pixel.className = 'w-full h-full rounded-lg brick-gray animate-pixel';
              block.appendChild(pixel);
            }
            if (elapsedSecs >= FREE_MODE_MAX_MINUTES * 60) completeSession(Math.floor(FREE_MODE_MAX_MINUTES / 10));
          }
        }, 500);

      } else {
        clearInterval(timer);
        if (currentMode === 'free') {
          const elapsedSecs = Math.floor((Date.now() - startTime) / 1000);
          const earnedBricks = Math.floor(Math.floor(elapsedSecs / 60) / 10);
          if (earnedBricks > 0) {
            recordTodayBricks(currentTag, earnedBricks);
            triggerCompletionAnimations(earnedBricks);
          }
        }
        isFocusing = false;
        document.title = DEFAULT_TITLE;
        initSandbox();
        startBtn.textContent = '开启专注';
        startBtn.className = 'w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs tracking-wide hover:bg-emerald-400 active:scale-95 transition-all duration-200 shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0';
        statusText.textContent = '准备状态：已中断';
        statusText.className = 'text-xs font-medium text-slate-500 hidden sm:block';
      }
    }

    function completeSession(brickRewardCount) {
      clearInterval(timer);
      isFocusing = false;
      document.title = DEFAULT_TITLE;

      const statusText = document.getElementById('status-text');
      const startBtn = document.getElementById('start-btn');

      statusText.textContent = `🎉 专注成功！存入 ${brickRewardCount} 块积木`;
      statusText.className = 'text-xs font-semibold text-emerald-400 hidden sm:block';

      recordTodayBricks(currentTag, brickRewardCount);
      triggerCompletionAnimations(brickRewardCount);

      initSandbox();
      startBtn.textContent = '开启下一轮';
      startBtn.className = 'w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs tracking-wide hover:bg-emerald-400 active:scale-95 transition-all duration-200 shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0';
    }

    function triggerCompletionAnimations(rewardCount) {
      if (currentMode === '10m') {
        const card = document.getElementById('sandbox-card');
        const rect = card.getBoundingClientRect();
        const originX = (rect.left + rect.width / 2) / window.innerWidth;
        const originY = (rect.top + rect.height / 3) / window.innerHeight;

        confetti({
          particleCount: 50,
          spread: 60,
          origin: { x: originX, y: originY },
          colors: ['#6366f1', '#a855f7', '#ec4899', '#38bdf8', '#fbbf24']
        });
      } else if (currentMode === '25m') {
        const card = document.getElementById('sandbox-card');
        card.classList.remove('animate-card-pulse');
        void card.offsetWidth;
        card.classList.add('animate-card-pulse');
      } else {
        const shockwave = document.getElementById('shockwave');
        const gridBox = document.getElementById('sandbox-grid');
        const colors = ['#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];

        const gridRect = gridBox.getBoundingClientRect();
        const centerX = gridRect.left + gridRect.width / 2;
        const centerY = gridRect.top + gridRect.height / 2;

        for (let i = 0; i < 22; i++) {
          const particle = document.createElement('div');
          particle.className = 'energy-particle';
          const color = colors[Math.floor(Math.random() * colors.length)];
          particle.style.backgroundColor = color;
          particle.style.color = color;

          const angle = Math.random() * Math.PI * 2;
          const radius = 160 + Math.random() * 90;
          const startX = centerX + Math.cos(angle) * radius;
          const startY = centerY + Math.sin(angle) * radius;

          particle.style.left = `${startX}px`;
          particle.style.top = `${startY}px`;
          document.body.appendChild(particle);

          const duration = 400 + Math.random() * 200;
          particle.animate([
            { left: `${startX}px`, top: `${startY}px`, opacity: 0, transform: 'scale(0.5)' },
            { opacity: 1, transform: 'scale(1.4)', offset: 0.2 },
            { left: `${centerX}px`, top: `${centerY}px`, opacity: 0.9, transform: 'scale(0.3)' }
          ], {
            duration: duration,
            easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
            fill: 'forwards'
          }).onfinish = () => particle.remove();
        }

        setTimeout(() => {
          shockwave.classList.remove('animate-shockwave');
          void shockwave.offsetWidth;
          shockwave.classList.add('animate-shockwave');
        }, 350);
      }
    }

    function renderTaskButtons() {
      const container = document.getElementById('tag-container');
      container.innerHTML = '';

      tasks.forEach(task => {
        const btn = document.createElement('button');
        btn.onclick = () => selectTag(task.id);
        const isSelected = task.id === currentTag;
        btn.className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-all duration-200 border flex items-center gap-1.5 shrink-0 ${
          isSelected ? 'bg-slate-800 font-semibold shadow-sm border-slate-700/80' : 'text-slate-400 hover:text-slate-200 border-transparent'
        }`;
        if (isSelected) btn.style.color = task.color;
        btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background-color: ${task.color}"></span> ${task.name}`;
        container.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.onclick = openAddTaskModal;
      addBtn.className = 'px-2 py-1 rounded-lg text-xs text-slate-400 hover:text-slate-100 bg-slate-900 hover:bg-slate-800 transition-all border border-slate-800 shrink-0';
      addBtn.textContent = '+';
      container.appendChild(addBtn);
    }

    function selectTag(tagId) {
      if (isFocusing) return;
      currentTag = tagId;
      renderTaskButtons();
    }

    function renderTodayBricks() {
      const bricks = loadTodayData();
      const wallGrid = document.getElementById('today-wall-grid');
      const countLabel = document.getElementById('today-count');
      
      countLabel.textContent = bricks.length;
      wallGrid.innerHTML = '';

      if (bricks.length === 0) {
        wallGrid.innerHTML = '<div id="empty-tip" class="text-[10px] text-slate-600 italic">尚无积木...</div>';
        return;
      }

      const taskMap = Object.fromEntries(tasks.map(t => [t.id, t.color]));

      bricks.forEach((tagId) => {
        const brick = document.createElement('div');
        const color = taskMap[tagId] || '#38bdf8';
        brick.className = 'w-3.5 h-3.5 rounded-sm animate-drop-bounce flex-shrink-0';
        brick.style.backgroundColor = color;
        brick.style.boxShadow = `0 0 6px ${color}90`;
        wallGrid.appendChild(brick);
      });
    }

    function openAddTaskModal() {
      if (isFocusing) return;
      document.getElementById('add-task-modal').classList.remove('hidden');
      resetTaskForm();
      renderColorPalette();
      renderCustomTaskManageList();
    }

    function closeAddTaskModal() { document.getElementById('add-task-modal').classList.add('hidden'); resetTaskForm(); }

    function renderColorPalette() {
      const picker = document.getElementById('color-picker-list');
      picker.innerHTML = '';
      PIXEL_PALETTE.forEach(color => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = `w-5 h-5 rounded-md transition-all border ${selectedColor === color ? 'border-white scale-110 shadow-md' : 'border-transparent opacity-75 hover:opacity-100'}`;
        dot.style.backgroundColor = color;
        dot.onclick = () => { selectedColor = color; renderColorPalette(); };
        picker.appendChild(dot);
      });
    }

    function resetTaskForm() {
      document.getElementById('edit-task-id').value = '';
      document.getElementById('new-task-name').value = '';
      document.getElementById('form-mode-label').textContent = '➕ 添加新模块';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      selectedColor = PIXEL_PALETTE[0];
      renderColorPalette();
    }

    function editTask(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById('edit-task-id').value = task.id;
      document.getElementById('new-task-name').value = task.name;
      document.getElementById('form-mode-label').textContent = '✏️ 编辑模块';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      selectedColor = task.color;
      renderColorPalette();
    }

    function saveTaskFromModal() {
      const name = document.getElementById('new-task-name').value.trim();
      const editId = document.getElementById('edit-task-id').value;
      if (!name) return alert('请输入模块名称');

      if (editId) {
        const idx = tasks.findIndex(t => t.id === editId);
        if (idx !== -1) { tasks[idx].name = name; tasks[idx].color = selectedColor; }
      } else {
        const newId = 'task_' + Date.now();
        tasks.push({ id: newId, name: name, color: selectedColor });
        currentTag = newId;
      }

      saveTasks();
      renderTaskButtons();
      renderCustomTaskManageList();
      resetTaskForm();
    }

    function renderCustomTaskManageList() {
      const listContainer = document.getElementById('custom-task-manage-list');
      listContainer.innerHTML = '';

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800/80';
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-md shrink-0" style="background-color: ${task.color}"></span>
            <span class="text-xs text-slate-200 font-medium">${task.name}</span>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="editTask('${task.id}')" class="text-slate-400 hover:text-sky-400 text-xs px-1.5 py-0.5 rounded transition-all hover:bg-slate-900">✏️</button>
            <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-400 text-xs px-1.5 py-0.5 rounded transition-all hover:bg-slate-900">🗑️</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function deleteTask(taskId) {
      if (tasks.length <= 1) return alert('请至少保留一个分类模块！');
      tasks = tasks.filter(t => t.id !== taskId);
      saveTasks();
      if (currentTag === taskId) currentTag = tasks[0].id;
      renderTaskButtons();
      renderCustomTaskManageList();
      renderTodayBricks();
    }

    function openStatsModal() { document.getElementById('stats-modal').classList.remove('hidden'); renderWeeklyChart(); }
    function closeStatsModal() { document.getElementById('stats-modal').classList.add('hidden'); }

    function renderWeeklyChart() {
      const history = getHistoryData();
      const past7Days = Array.from({length: 7}, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - i);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const countsMap = {};
      let totalCount = 0;

      past7Days.forEach(dateKey => {
        (history[dateKey] || []).forEach(tagId => {
          countsMap[tagId] = (countsMap[tagId] || 0) + 1;
          totalCount++;
        });
      });

      document.getElementById('pie-total-count').textContent = totalCount;
      const canvas = document.getElementById('weekly-pie-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const legendBox = document.getElementById('pie-legend');
      legendBox.innerHTML = '';

      if (totalCount === 0) {
        ctx.beginPath();
        ctx.arc(72, 72, 56, 0, Math.PI * 2);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 14;
        ctx.stroke();
        legendBox.innerHTML = '<div class="text-slate-600 italic">近 7 天暂无积累积木</div>';
        return;
      }

      const taskMap = Object.fromEntries(tasks.map(t => [t.id, t]));
      let startAngle = -Math.PI / 2;

      Object.keys(countsMap).forEach(tagId => {
        const count = countsMap[tagId];
        const sliceAngle = (count / totalCount) * (Math.PI * 2);
        const task = taskMap[tagId] || { name: '已删除模块', color: '#64748b' };

        ctx.beginPath();
        ctx.arc(72, 72, 56, startAngle, startAngle + sliceAngle);
        ctx.strokeStyle = task.color;
        ctx.lineWidth = 14;
        ctx.stroke();

        startAngle += sliceAngle;

        const legendItem = document.createElement('div');
        legendItem.className = 'flex items-center justify-between text-slate-300';
        legendItem.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${task.color}"></span>
            <span>${task.name}</span>
          </div>
          <span class="font-mono text-slate-400">${count}块 (${Math.round((count / totalCount) * 100)}%)</span>
        `;
        legendBox.appendChild(legendItem);
      });
    }

    function exportDataJSON() {
      const backupObj = { version: 'v3.1', tasks: tasks, history: getHistoryData() };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pixel_focus_backup_${getTodayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerImportJSON() { document.getElementById('import-json-input').click(); }

    function importDataJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.tasks && imported.history) {
            tasks = imported.tasks; saveTasks(); saveHistoryData(imported.history);
            renderTaskButtons(); renderTodayBricks(); renderWeeklyChart();
            alert('数据导入成功！');
          }
        } catch(err) { alert('解析 JSON 失败'); }
      };
      reader.readAsText(file);
    }

    function copyBackupToClipboard() {
      navigator.clipboard.writeText(JSON.stringify({ tasks: tasks, history: getHistoryData() })).then(() => {
        alert('已成功复制全量备份文本到剪贴板！');
      });
    }

    function openSyncModal() { document.getElementById('sync-modal').classList.remove('hidden'); }
    function closeSyncModal() { document.getElementById('sync-modal').classList.add('hidden'); }

    /* 重构后的跨端同步快照逻辑：百分之百稳定，无需依赖外部二维码库 */
    function generateSyncSnapshot() {
      const snapshot = JSON.stringify({ version: 'v3.1', tasks: tasks, history: getHistoryData() });
      navigator.clipboard.writeText(snapshot).then(() => {
        alert('✅ 同步快照码已成功生成并复制到剪贴板！\n\n请直接将它通过微信发到手机或其他浏览器中，粘贴到下方输入框即可完成跨端恢复。');
      }).catch(() => {
        // 兜底：如果剪贴板受权限限制，直接填入文本框手动复制
        const textarea = document.getElementById('input-sync-code');
        textarea.value = snapshot;
        alert('已生成快照代码，请在下方文本框中手动复制。');
      });
    }

    function pullDataBySnapshot() {
      const val = document.getElementById('input-sync-code').value.trim();
      if (!val) return alert('请输入或粘贴有效的同步快照码！');
      try {
        const imported = JSON.parse(val);
        // 校验是否同时包含 tasks 和 history，保证分类与积木记录完美双向同步
        if (imported.tasks && imported.history) {
          tasks = imported.tasks; 
          saveTasks(); 
          saveHistoryData(imported.history);
          
          renderTaskButtons(); 
          renderTodayBricks(); 
          
          alert('🎉 跨端同步成功！分类模块与积木历史已全部就绪。'); 
          closeSyncModal();
        } else {
          alert('数据格式不匹配，缺少必要的分类或历史记录。');
        }
      } catch (e) {
        alert('解析失败，请检查同步码是否复制完整。');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      switchMode('10m');
      renderTaskButtons();
      renderTodayBricks();
    });
  </script>
</body>
</html>
